<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartao</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="form">
        <h1>Formulario de preenchimento</h1>
        <input type="text" id="nome" placeholder="Digite seu nome aqui: ">
        <input type="text" id="numero" placeholder="Digite o numero do Cartão aqui: ">
        <input type="text" id="validade" placeholder="Digite a validade do Cartão aqui: ">
        <input type="text" id="senha" placeholder="Digite sua senha aqui: ">
    </section>
    <section id="card">
        <h1>Cartão de credito</h1>
        <div id="linha"></div>
        <h3 id="momeCartao"></h3>
        <h3 id="numeroCartao"></h3>
        <h3 id="validadeCartao"></h3>
        <h3 id="senhaCartao"></h3>
    </section>
    <script src="script.js"></script>
</body>
</html>
